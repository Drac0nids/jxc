name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 复用两个构建工作流，避免发布链路与日常构建出现两份实现
  android:
    uses: ./.github/workflows/android-apk.yml

  windows:
    uses: ./.github/workflows/client-windows-installer.yml

  publish:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - windows
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*
