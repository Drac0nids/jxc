name: 功能建议
description: 提出一个新功能或改进建议
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提交前建议先看一下 README 的「已知缺口」与「路线图」，避免与已有计划重复。

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 服务端（Rust / Axum）
        - Android 端（Flutter）
        - Windows 客户端（Tauri + Vue）
        - 文档 / 构建 / CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么问题
      description: 描述实际场景，而不是直接给方案。例如「盘点时无法…」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
